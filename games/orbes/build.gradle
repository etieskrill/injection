plugins {
    id 'application'
    id 'java'
}

application {
    mainClass = 'org.etieskrill.orbes.Game'
}

dependencies {
    implementation project(':engine')
    implementation 'org.jetbrains:annotations:24.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
}

test {
    useJUnitPlatform()
}
